version: "3.9"

services:
  web:
    image: yan1906/fastapi_crud_rep
    container_name: fastapi_app
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # volumes:
    #   - ./:/usr/src/app:ro
    ports:
      - "80:8000"
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=prod
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    ports:
      - "5432:5432"

volumes:
  postgres_data:
